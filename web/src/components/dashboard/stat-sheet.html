<div class="fixed inset-0 z-50 medium-up:hidden">
  <div class="absolute inset-0 bg-black/40" (click)="close()" aria-hidden="true"></div>

  <div
    role="dialog"
    aria-modal="true"
    aria-label="Choose a statistic"
    class="absolute inset-x-0 bottom-0 max-h-[75dvh] flex flex-col rounded-t-2xl bg-surface-raised shadow-lg ring-1 ring-edge-raised"
  >
    <div class="flex-none pt-2 pb-1 flex justify-center" aria-hidden="true">
      <div class="w-10 h-1 rounded-full bg-slate-300 dark:bg-slate-600"></div>
    </div>

    <h2 class="flex-none px-4 pb-2 text-xs font-semibold uppercase tracking-wider text-ink-muted">
      Songs statistics
    </h2>

    <ul role="list" class="flex-1 overflow-y-auto pb-[env(safe-area-inset-bottom)]">
      <li *for="def of stats; key: def.type">
        <button
          type="button"
          (click)="pick(def.type)"
          [aria-current]="current === def.type ? 'true' : null"
          class="cursor-pointer w-full flex items-center gap-3 px-4 py-3 text-sm font-medium text-left transition-colors"
          [class]="current === def.type ? 'bg-fill-raised text-ink' : 'text-ink-soft hover:bg-fill-raised'"
        >
          <app-icon [name]="def.icon" class="w-5 h-5 shrink-0" aria-hidden="true"></app-icon>
          {{ def.label }}
        </button>
      </li>
    </ul>
  </div>
</div>

<button
  type="button"
  role="menuitem"
  (click)="toggleAutoplay()"
  class="cursor-pointer w-full flex items-center gap-3 px-4 py-2.5 text-sm text-ink-soft hover:bg-fill-raised transition-colors text-left"
>
  <app-icon [name]="autoplay ? 'heroPause' : 'heroPlay'" class="w-4 h-4 shrink-0" aria-hidden="true"></app-icon>
  {{ t(autoplay ? 'dashboard.stopAutoplay' : 'dashboard.autoplay') }}
</button>

<button
  type="button"
  role="menuitem"
  (click)="exportCard()"
  class="cursor-pointer w-full flex items-center gap-3 px-4 py-2.5 text-sm text-ink-soft hover:bg-fill-raised transition-colors text-left"
>
  <svg
    class="w-4 h-4 shrink-0"
    fill="none"
    viewBox="0 0 24 24"
    stroke-width="2"
    stroke="currentColor"
    aria-hidden="true"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"
    ></path>
  </svg>
  {{ t('dashboard.exportImage') }}
</button>

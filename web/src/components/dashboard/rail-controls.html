<button
  type="button"
  (click)="toggleAutoplay()"
  [aria-pressed]="autoplay"
  [aria-label]="autoplay ? 'Stop autoplay' : 'Start autoplay'"
  [title]="autoplay ? 'Stop autoplay' : 'Autoplay'"
  class="cursor-pointer flex items-center justify-center w-10 h-10 rounded-xl transition-colors"
  [class]="autoplay ? 'bg-fill-strong text-ink' : 'text-ink-muted hover:bg-fill hover:text-ink'"
>
  <app-icon [name]="autoplay ? 'heroPause' : 'heroPlay'" class="w-5 h-5" aria-hidden="true"></app-icon>
</button>

<label class="flex items-center justify-between gap-3 text-sm text-ink-soft">
  <span [class]="compact ? 'sr-only' : ''">{{ t('theme.label') }}</span>
  <select
    (change)="choose($event.target.value)"
    class="cursor-pointer bg-fill hover:bg-fill-strong text-sm font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-accent/40"
    [class]="compact
      ? 'h-9 rounded-full px-3 text-ink-soft'
      : 'rounded-lg border border-edge-raised px-2 py-1 text-ink'"
  >
    <option *for="o of themes; key: o.id" [value]="o.id" [.selected]="o.id === current">
      {{ t(o.labelKey) }}
    </option>
  </select>
</label>

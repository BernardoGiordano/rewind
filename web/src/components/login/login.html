<div class="min-h-dvh flex flex-col bg-surface">
  <!-- Top bar — branding + dark mode toggle -->
  <div class="flex items-center justify-between px-6 py-4 expanded:px-10 expanded:py-6">
    <h1 class="font-mono font-bold text-ink tracking-tight text-base expanded:text-lg">
      Navidrome Rewind
    </h1>
    <button
      type="button"
      (click)="toggleDarkMode()"
      class="cursor-pointer flex items-center justify-center w-9 h-9 rounded-full text-ink-soft bg-fill hover:bg-fill-strong transition-colors"
      [aria-label]="darkMode ? 'Switch to light mode' : 'Switch to dark mode'"
    >
      <app-icon [name]="darkMode ? 'heroSun' : 'heroMoon'" class="w-4 h-4" aria-hidden="true"></app-icon>
    </button>
  </div>

  <!-- Card -->
  <div class="flex-1 flex items-center justify-center px-4 pb-10">
    <div class="w-full max-w-sm">
      <div class="rounded-2xl bg-surface-sunken border border-edge shadow-sm p-6 medium-up:p-8">
        <div class="mb-6">
          <h2 class="text-xl font-semibold text-ink">Sign in</h2>
          <p class="mt-1 text-sm text-ink-muted">Use your Navidrome username and password.</p>
        </div>

        <form (submit)="submit($event)" class="space-y-4" novalidate>
          <!-- Username -->
          <div>
            <label
              for="username"
              class="block text-xs font-semibold uppercase tracking-wider text-ink-muted mb-1.5"
            >
              Username
            </label>
            <div class="relative">
              <span
                class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-ink-faint"
              >
                <app-icon name="heroUser" class="w-4 h-4" aria-hidden="true"></app-icon>
              </span>
              <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                spellcheck="false"
                autocapitalize="off"
                required
                [.value]="username"
                (input)="setUsername($event.target.value)"
                [disabled]="submitting"
                class="w-full pl-9 pr-3 py-2.5 rounded-lg bg-surface-raised border border-edge-raised text-sm text-ink-body placeholder:text-ink-faint focus:outline-none focus:ring-2 focus:ring-slate-900 dark:focus:ring-white transition-colors disabled:opacity-60"
                placeholder="username"
              />
            </div>
          </div>

          <!-- Password -->
          <div>
            <label
              for="password"
              class="block text-xs font-semibold uppercase tracking-wider text-ink-muted mb-1.5"
            >
              Password
            </label>
            <div class="relative">
              <span
                class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-ink-faint"
              >
                <app-icon name="heroLockClosed" class="w-4 h-4" aria-hidden="true"></app-icon>
              </span>
              <input
                id="password"
                name="password"
                [type]="showPassword ? 'text' : 'password'"
                autocomplete="current-password"
                required
                [.value]="password"
                (input)="setPassword($event.target.value)"
                [disabled]="submitting"
                class="w-full pl-9 pr-10 py-2.5 rounded-lg bg-surface-raised border border-edge-raised text-sm text-ink-body placeholder:text-ink-faint focus:outline-none focus:ring-2 focus:ring-slate-900 dark:focus:ring-white transition-colors disabled:opacity-60"
                placeholder="••••••••"
              />
              <button
                type="button"
                (click)="togglePassword()"
                [aria-label]="showPassword ? 'Hide password' : 'Show password'"
                class="cursor-pointer absolute inset-y-0 right-2 flex items-center px-1.5 text-ink-faint hover:text-slate-700 dark:hover:text-slate-200 transition-colors"
              >
                <app-icon [name]="showPassword ? 'heroEyeSlash' : 'heroEye'" class="w-4 h-4" aria-hidden="true"></app-icon>
              </button>
            </div>
          </div>

          <div
            *if="error"
            role="alert"
            class="flex items-start gap-2 rounded-lg bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/60 px-3 py-2 text-sm text-red-700 dark:text-red-300"
          >
            <app-icon name="heroExclamationCircle" class="w-4 h-4 mt-0.5 shrink-0" aria-hidden="true"></app-icon>
            <span>{{ error }}</span>
          </div>

          <button
            type="submit"
            [disabled]="submitting"
            class="w-full cursor-pointer flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-selected text-on-selected text-sm font-semibold hover:bg-slate-800 dark:hover:bg-slate-100 transition-colors disabled:opacity-60 disabled:cursor-not-allowed"
          >
            <span
              *if="submitting"
              class="inline-block w-4 h-4 border-2 border-white/40 dark:border-slate-900/40 border-t-white dark:border-t-slate-900 rounded-full animate-spin"
              aria-hidden="true"
            ></span>
            {{ submitting ? 'Signing in…' : 'Sign in' }}
          </button>
        </form>
      </div>

      <p class="mt-6 text-center text-xs text-ink-faint">
        Your credentials are sent to your Navidrome server for verification.
      </p>
    </div>
  </div>
</div>

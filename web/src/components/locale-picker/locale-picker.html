<label class="flex items-center justify-between gap-3 text-sm text-ink-soft">
  <span [class]="compact ? 'sr-only' : ''">{{ t('locale.label') }}</span>
  <select
    (change)="choose($event.target.value)"
    [disabled]="isLoadingLocale"
    class="cursor-pointer bg-fill hover:bg-fill-strong text-sm font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-accent/40 disabled:opacity-60"
    [class]="compact
      ? 'h-9 rounded-full px-3 text-ink-soft'
      : 'rounded-lg border border-edge-raised px-2 py-1 text-ink'"
  >
    <option *for="l of languages; key: l.code" [value]="l.code" [.selected]="l.code === locale">
      {{ l.label }}
    </option>
  </select>
</label>

<div class="h-dvh flex flex-col medium-up:pl-16 bg-surface">
  <!-- RAIL — brand, sections, route tools, then range, route controls and account. -->
  <nav
    class="hidden medium-up:flex fixed inset-y-0 left-0 w-16 z-30 flex-col items-center pt-6 pb-3 bg-surface-sunken border-r border-edge"
    [aria-label]="t('nav.sections')"
  >
    <a
      href="/"
      class="shrink-0 [writing-mode:vertical-rl] rotate-180 font-mono font-bold text-ink tracking-tight text-sm whitespace-nowrap"
      >Navidrome Rewind</a
    >

    <ul role="list" class="mt-6 flex flex-col items-center gap-1">
      <li *for="s of sections; key: s.id">
        <a
          [href]="s.route"
          [aria-current]="isActive(s.id) ? 'page' : null"
          [title]="t(s.labelKey)"
          [aria-label]="t(s.labelKey)"
          class="flex items-center justify-center w-10 h-10 rounded-xl transition-colors"
          [class]="isActive(s.id) ? 'bg-selected text-on-selected' : 'text-ink-muted hover:bg-fill hover:text-ink'"
        >
          <app-icon [name]="s.icon" class="w-5 h-5" aria-hidden="true"></app-icon>
        </a>
      </li>
    </ul>

    <div *if="railTools" class="w-8 border-t border-edge my-3" aria-hidden="true"></div>
    <x-outlet [.target]="&railTools"></x-outlet>

    <div class="flex-1 min-h-3" aria-hidden="true"></div>

    <div class="flex flex-col items-center gap-1">
      <button
        *if="showRange"
        type="button"
        (click)="toggleRangePanel()"
        [aria-expanded]="rangePanelOpen"
        aria-haspopup="dialog"
        [aria-label]="t('range.change', { label: rangeLabel })"
        [title]="t('range.titled', { label: rangeLabel })"
        class="cursor-pointer flex flex-col items-center gap-0.5 w-12 py-1.5 rounded-xl transition-colors"
        [class]="rangePanelOpen ? 'bg-selected text-on-selected' : 'text-ink-muted hover:bg-fill hover:text-ink'"
      >
        <app-icon name="heroCalendarDays" class="w-5 h-5" aria-hidden="true"></app-icon>
        <span class="font-mono text-[9px] leading-none max-w-full truncate">{{ rangeShortLabel }}</span>
      </button>

      <x-outlet [.target]="&railControls"></x-outlet>

      <div *if="currentUser" class="w-8 border-t border-edge my-1" aria-hidden="true"></div>
      <button
        *if="currentUser"
        type="button"
        (click)="toggleAccount()"
        [aria-expanded]="accountOpen"
        aria-haspopup="dialog"
        [aria-label]="t('account.label', { username: currentUser.username })"
        [title]="currentUser.username"
        class="cursor-pointer flex items-center justify-center w-10 h-10 rounded-xl transition-colors"
        [class]="accountOpen ? 'bg-fill-strong' : 'hover:bg-fill'"
      >
        <span
          class="flex items-center justify-center w-7 h-7 rounded-full bg-selected text-on-selected text-xs font-bold"
          aria-hidden="true"
          >{{ initial }}</span
        >
      </button>
    </div>
  </nav>

  <!-- ACCOUNT POPOVER — anchored to the foot of the rail -->
  <div
    *if="accountOpen && currentUser"
    class="hidden medium-up:block fixed inset-0 z-50"
    (click)="closeAccount()"
    aria-hidden="true"
  ></div>
  <div
    *if="accountOpen && currentUser"
    role="dialog"
    [aria-label]="t('account.title')"
    class="hidden medium-up:block fixed z-60 left-[4.5rem] bottom-3 w-64 rounded-xl bg-surface-raised shadow-lg ring-1 ring-edge-raised overflow-hidden"
  >
    <div class="flex items-center gap-3 px-4 py-3">
      <span
        class="flex items-center justify-center w-9 h-9 shrink-0 rounded-full bg-selected text-on-selected text-sm font-bold"
        aria-hidden="true"
        >{{ initial }}</span
      >
      <div class="min-w-0">
        <p class="text-[10px] font-semibold uppercase tracking-wider text-ink-faint leading-none">
          {{ t('account.signedInAs') }}
        </p>
        <p class="mt-1 text-sm font-semibold text-ink truncate" [title]="currentUser?.username ?? ''">
          {{ currentUser?.username }}
        </p>
      </div>
    </div>
    <div class="border-t border-edge-raised p-1">
      <button
        *if="canLogout"
        type="button"
        (click)="logout()"
        class="cursor-pointer w-full flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-ink-soft hover:bg-fill-raised hover:text-ink transition-colors text-left"
      >
        <app-icon name="heroArrowRightOnRectangle" class="w-4 h-4 shrink-0" aria-hidden="true"></app-icon>
        {{ t('account.signOut') }}
      </button>
      <p *else class="px-3 py-2 text-xs text-ink-muted">
        {{ t('account.envSession') }}
      </p>
    </div>
    <div class="border-t border-edge-raised px-4 py-3 flex flex-col gap-3">
      <app-theme-picker></app-theme-picker>
      <app-locale-picker></app-locale-picker>
    </div>
  </div>

  <!-- COMPACT BAR — brand, sections, menu. Medium and expanded use the rail. -->
  <header
    class="medium-up:hidden fixed top-0 inset-x-0 z-30 h-14 bg-surface-sunken border-b border-edge px-4 flex items-center justify-between gap-3"
  >
    <a href="/" class="text-base font-mono font-bold text-ink truncate">Navidrome Rewind</a>

    <div class="flex items-center gap-1">
      <a
        *for="s of sections; key: s.id"
        [href]="s.route"
        [aria-current]="isActive(s.id) ? 'page' : null"
        [aria-label]="t(s.labelKey)"
        class="flex items-center justify-center w-9 h-9 rounded-full transition-colors"
        [class]="isActive(s.id) ? 'bg-selected text-on-selected' : 'text-ink-soft hover:bg-fill'"
      >
        <app-icon [name]="s.icon" class="w-5 h-5" aria-hidden="true"></app-icon>
      </a>

      <button
        type="button"
        id="shell-menu-trigger"
        (click)="toggleMenu()"
        [aria-expanded]="menuOpen"
        [aria-controls]="menuOpen ? 'shell-menu' : null"
        aria-haspopup="true"
        [aria-label]="t('nav.openMenu')"
        class="cursor-pointer flex items-center justify-center w-9 h-9 rounded-full text-ink-soft bg-fill hover:bg-fill-strong transition-colors"
      >
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 6.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5ZM12 12.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5ZM12 18.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5Z"
          ></path>
        </svg>
      </button>
    </div>
  </header>

  <div *if="menuOpen" class="medium-up:hidden fixed inset-0 z-30" (click)="closeMenu()" aria-hidden="true"></div>

  <div
    *if="menuOpen"
    id="shell-menu"
    role="menu"
    aria-labelledby="shell-menu-trigger"
    aria-orientation="vertical"
    class="medium-up:hidden fixed right-4 top-14 mt-1 w-64 max-h-[calc(100dvh-4.5rem)] overflow-y-auto rounded-xl bg-surface-raised shadow-lg ring-1 ring-edge-raised z-40 py-1 focus:outline-none"
  >
    <div *if="currentUser" class="flex items-center gap-2 px-4 py-3">
      <app-icon name="heroUserCircle" class="w-5 h-5 shrink-0 text-ink-muted" aria-hidden="true"></app-icon>
      <div class="flex-1 min-w-0">
        <p class="text-[10px] font-semibold uppercase tracking-wider text-ink-faint leading-none">
          {{ t('account.signedInAs') }}
        </p>
        <p class="mt-0.5 text-sm font-medium text-ink truncate" [title]="currentUser.username">
          {{ currentUser.username }}
        </p>
      </div>
      <button
        *if="canLogout"
        type="button"
        (click)="logout()"
        [title]="t('account.signOut')"
        [aria-label]="t('account.signOut')"
        class="cursor-pointer flex items-center justify-center w-8 h-8 rounded-md text-ink-muted hover:bg-fill-raised hover:text-ink transition-colors"
      >
        <app-icon name="heroArrowRightOnRectangle" class="w-4 h-4" aria-hidden="true"></app-icon>
      </button>
    </div>
    <div *if="currentUser" role="separator" class="my-1 border-t border-edge-raised"></div>

    <a
      *for="s of sections; key: s.id"
      [href]="s.route"
      [aria-current]="isActive(s.id) ? 'page' : null"
      role="menuitem"
      (click)="closeMenu()"
      class="w-full flex items-center gap-3 px-4 py-2.5 text-sm hover:bg-fill-raised transition-colors"
      [class]="isActive(s.id) ? 'bg-fill-raised text-ink' : 'text-ink-soft'"
    >
      <app-icon [name]="s.icon" class="w-4 h-4 shrink-0" aria-hidden="true"></app-icon>
      {{ t(s.labelKey) }}
    </a>

    <div *if="showRange" role="separator" class="my-1 border-t border-edge-raised"></div>
    <button
      *if="showRange"
      type="button"
      role="menuitem"
      (click)="toggleRangePanel()"
      aria-haspopup="dialog"
      class="cursor-pointer w-full flex items-center gap-3 px-4 py-2.5 text-sm text-ink-soft hover:bg-fill-raised transition-colors text-left"
    >
      <app-icon name="heroCalendarDays" class="w-4 h-4 shrink-0" aria-hidden="true"></app-icon>
      <span class="flex-1 min-w-0">
        <span class="block">{{ t('range.title') }}</span>
        <span class="block text-xs text-ink-muted truncate">{{ rangeLabel }}</span>
      </span>
      <app-icon name="heroChevronRight" class="w-4 h-4 shrink-0 text-ink-faint" aria-hidden="true"></app-icon>
    </button>

    <div *if="menuActions" role="separator" class="my-1 border-t border-edge-raised"></div>
    <x-outlet [.target]="&menuActions"></x-outlet>

    <div role="separator" class="my-1 border-t border-edge-raised"></div>

    <div class="px-4 py-2.5 flex flex-col gap-3">
      <app-theme-picker></app-theme-picker>
      <app-locale-picker></app-locale-picker>
    </div>

    <div role="separator" class="my-1 border-t border-edge-raised"></div>

    <a
      href="https://github.com/BernardoGiordano/rewind"
      target="_blank"
      rel="noopener noreferrer"
      role="menuitem"
      (click)="closeMenu()"
      class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-ink-soft hover:bg-fill-raised transition-colors"
    >
      <svg class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path
          fill-rule="evenodd"
          clip-rule="evenodd"
          d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.013-1.703-2.782.604-3.369-1.342-3.369-1.342-.454-1.155-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0 1 12 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.744 0 .267.18.579.688.481C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10Z"
        ></path>
      </svg>
      GitHub
    </a>

    <a
      href="https://www.paypal.com/paypalme/BernardoGiordano"
      target="_blank"
      rel="noopener noreferrer"
      role="menuitem"
      (click)="closeMenu()"
      class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-ink-soft hover:bg-fill-raised transition-colors"
    >
      <svg
        class="w-4 h-4 shrink-0"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke="currentColor"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"
        ></path>
      </svg>
      {{ t('links.donate') }}
    </a>

    <div role="separator" class="my-1 border-t border-edge-raised"></div>

    <p class="px-4 py-2.5 text-sm text-ink-faint"><app-byline></app-byline></p>
  </div>

  <!-- PERIOD PANEL — a popover by the rail at medium-up, a bottom sheet on compact -->
  <div
    *if="rangePanelOpen"
    class="fixed inset-0 z-50 bg-black/40 medium-up:bg-transparent"
    (click)="closeRangePanel()"
    aria-hidden="true"
  ></div>
  <div
    *if="rangePanelOpen"
    role="dialog"
    aria-modal="true"
    [aria-label]="t('range.title')"
    class="fixed z-60 inset-x-0 bottom-0 max-h-[85dvh] overflow-y-auto rounded-t-2xl pb-[env(safe-area-inset-bottom)] medium-up:inset-x-auto medium-up:left-[4.5rem] medium-up:bottom-3 medium-up:max-h-[calc(100dvh-1.5rem)] medium-up:rounded-xl medium-up:pb-0 bg-surface-raised shadow-xl ring-1 ring-edge-raised"
  >
    <app-period-panel (closed)="closeRangePanel()"></app-period-panel>
  </div>

  <!-- Author credit — expanded only, and only where the route leaves the corner free -->
  <p
    *if="quietCorner"
    class="hidden expanded:block fixed bottom-4 right-4 z-20 text-sm font-medium text-ink-soft pointer-events-none select-none"
    aria-hidden="true"
  >
    <app-byline></app-byline>
  </p>

  <!-- Spacer under the fixed compact bar -->
  <div class="h-14 shrink-0 medium-up:hidden" aria-hidden="true"></div>

  <!-- CONTENT SLOT -->
  <div class="flex-1 min-h-0">
    <x-route-outlet></x-route-outlet>
  </div>
</div>
